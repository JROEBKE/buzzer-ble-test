
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judo-Buzzer BLE Test</title>
</head>
<body>
  <h1>Judo-Buzzer</h1>

  <button id="connect">Mit Buzzer verbinden</button>

  <p id="status">Nicht verbunden</p>
  <p id="buttonState">Noch kein Tastendruck</p>

  <script src="buzzer.js"></script>
  <p id="bluetoothSupport"></p>
<script>
  document.getElementById("bluetoothSupport").textContent =

</script>
</body>
